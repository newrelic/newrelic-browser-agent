# This composite action is used to purge one or more files in a fastly service cache.

name: 'Fastly Purge'

inputs:
  fastly_key:
    description: 'Fastly access key used for authentication.'
    required: true
  fastly_service:
    description: 'Fastly service to perform the purge on.'
    required: true
  purge_path:
    description: 'Path(s) to be purged. Separate multiple items by a space'
    required: true

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      run: npm ci --silent --no-progress --ignore-scripts --prefix $GITHUB_ACTION_PATH/..
      shell: bash
    - name: Run action script
      id: action-script
      env:
        INPUT_SERVICE: ${{ inputs.fastly_service }}
        INPUT_PURGE_PATH: ${{ inputs.purge_path }}
        FASTLY_API_TOKEN: ${{ inputs.fastly_key }}
      run: |
        # Globbing is off and the list variable below is deliberately unquoted so a space separated list splits into separate arguments
        set -f
        node "$GITHUB_ACTION_PATH/index.js" \
          --service "$INPUT_SERVICE" \
          --purge-path $INPUT_PURGE_PATH
      shell: bash
