name: 'WDIO: Single browser'

on:
  workflow_dispatch:
    inputs:
      browser-target:
        description: 'Which browser(s) and version(s) to target with the wdio test: chrome@latest OR chrome@* are examples'
        required: true
        type: string
      additional-flags:
        description: 'Additional flags to pass to the wdio cli'
        required: false
        type: string
      concurrency:
        description: 'The number of test runner threads to spawn for a run'
        required: false
        type: number
        default: 10
  workflow_call:
    inputs:
      browser-target:
        description: 'Which browser(s) and version(s) to target with the wdio test: chrome@latest OR chrome@* are examples'
        required: true
        type: string
      additional-flags:
        description: 'Additional flags to pass to the wdio cli'
        required: false
        type: string
      ref:
        description: 'Github branch ref to checkout and run tests on'
        required: false
        type: string
      concurrency:
        description: 'The number of test runner threads to spawn for a run'
        required: false
        type: number
        default: 10
    secrets:
      LAMBDA_USERNAME:
        required: true
      LAMBDA_ACCESS_KEY:
        required: true

permissions:
  contents: read

jobs:
  wdio:
    name: WDIO ${{ contains(inputs.additional-flags, '--webview') && 'WebView' || '' }} Test - '${{ inputs.browser-target }}'
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      LAMBDA_USERNAME: ${{ secrets.LAMBDA_USERNAME }}
      LAMBDA_ACCESS_KEY: ${{ secrets.LAMBDA_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24.22.1 # See package.json for the stable node version that works with our testing.  Do not change this unless you know what you are doing as some node versions do not play nicely with our testing server.
      - name: Install dependencies
        run: npm ci
      - name: Build agent
        run: |
          npm run build:all
      - name: Run WDIO Tests
        env:
          BROWSER_TARGET: ${{ inputs.browser-target }}
          CONCURRENCY: ${{ inputs.concurrency }}
          ADDITIONAL_FLAGS: ${{ inputs.additional-flags }}
          DEBUG_FLAGS: ${{ runner.debug && '-v -L -D -d' || '' }}
        run: |
          if ! [[ "${CONCURRENCY}" =~ ^[0-9]+$ ]]; then
            echo "concurrency must be a whole number"
            exit 1
          fi
          # Globbing is disabled and the flag variables are deliberately left unquoted below so they split into
          # separate CLI arguments without being evaluated by the shell.
          set -f
          node --max-old-space-size=8192 ./tools/wdio/bin/cli.js \
            -T \
            -b "${BROWSER_TARGET}" \
            --concurrent "${CONCURRENCY}" \
            ${DEBUG_FLAGS} \
            ${ADDITIONAL_FLAGS}
      - name: Generate wdio tunnel log archive name
        if: ${{ always() }}
        id: wdio-tunnel-log-archive-name
        env:
          BROWSER_TARGET: ${{ inputs.browser-target }}
          ADDITIONAL_FLAGS: ${{ inputs.additional-flags }}
        run: |
          # Keep only characters valid in a browser target
          browser="${BROWSER_TARGET//[^A-Za-z0-9@._,*-]/-}"
          suffix=''
          if [[ "${ADDITIONAL_FLAGS}" == *--webview* ]]; then suffix='-webview'; fi
          echo "results=${browser/\*/all}${suffix}-wdio-tunnel-logs" >> "$GITHUB_OUTPUT"
      - name: Archive wdio tunnel logs
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.wdio-tunnel-log-archive-name.outputs.results }}
          path: .lambdatest
