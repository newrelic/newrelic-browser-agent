# This workflow runs on creation and update of pull
# requests to execute jobs that do not require access
# to repository secrets. Jobs that do require repository
# secrets are executed when this workflow is manually
# executed to ensure protection of those secrets.

name: 'Pull Request Checks'

on:
  workflow_dispatch:
    inputs:
      latest-only:
        description: 'Run the latest version of browsers only instead of all versions'
        default: true
        type: boolean
      boosted:
        description: 'Enable boosted testing (uses more resources)'
        default: false
        type: boolean
  pull_request:

permissions:
  contents: read
  pull-requests: write

jobs:
  # Jobs for pull_request events

  jest-tests:
    name: Jest tests
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/jest.yml
    with:
      ref: ${{ github.ref }}
      coverage: true
    secrets: inherit

  supportability-metrics-check:
    runs-on: ubuntu-latest
    name: Supportability Metrics Check
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0 # See package.json for the stable node version that works with our testing.  Do not change this unless you know what you are doing as some node versions do not play nicely with our testing server.
      - name: Install dependencies
        run: npm ci
      - name: Checking that supportability metrics match the registry and docs
        run: npm run supportability-metrics:check

  types-test:
    runs-on: ubuntu-latest
    name: Types Test
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0 # See package.json for the stable node version that works with our testing.  Do not change this unless you know what you are doing as some node versions do not play nicely with our testing server.
      - name: Install dependencies
        run: npm ci
      - name: Running types build
        run: |
          npm run npm:build:types
      - name: Running types tests
        run: |
          npm run test:types

  eslint:
    name: ESLint
    if: github.event_name == 'pull_request'
    uses: ./.github/workflows/eslint.yml
    with:
      ref: ${{ github.ref }}

  # Decides whether this pull request changes the supportability metric registry or the dashboard generator. It is a separate, cheap job so
  # the preview below, which needs the assigned IP runner, only starts when there is something to preview.
  sm-changes:
    name: Supportability changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 5
    outputs:
      changed: ${{ steps.changes.outputs.changed }}
      sync_changed: ${{ steps.changes.outputs.sync_changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check whether the registry or the dashboard generator changed
        id: changes
        run: |
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- tools/supportability-metrics/registry.js tools/supportability-metrics/dashboard; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          # The Angler sync below is experimental, so changes to it (or to this workflow) also run it
          if git diff --quiet "origin/${{ github.base_ref }}...HEAD" -- tools/supportability-metrics/angler-sync.js .github/workflows/pull-request-checks.yml; then
            echo "sync_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "sync_changed=true" >> "$GITHUB_OUTPUT"
          fi

  # Creates or updates a copy of the generated supportability dashboard in staging for this pull request, so the registry change can be
  # previewed. It runs on the assigned IP runner because staging is reached from there, like the other jobs that call it. It only runs
  # for pull requests from this repository (forks do not get secrets), and a failure never blocks the pull request: the comment just
  # has no link.
  sm-dashboard-preview:
    name: Supportability dashboard preview
    needs: [sm-changes]
    runs-on: Browser-Agent-Assigned-IP-Linux
    if: needs.sm-changes.outputs.changed == 'true'
    continue-on-error: true
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    outputs:
      url: ${{ steps.preview.outputs.dashboard_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0 # See package.json for the stable node version that works with our testing.  Do not change this unless you know what you are doing as some node versions do not play nicely with our testing server.
      - name: Create or update the preview dashboard in staging
        id: preview
        env:
          NR_API_KEY_STAGING: ${{ secrets.NR_API_KEY_STAGING }}
        run: node tools/supportability-metrics/dashboard/apply.js --env staging --validate --pr "${{ github.event.number }}"

  sm-check:
    runs-on: ubuntu-latest
    needs: [sm-dashboard-preview]
    # Runs even when the preview was skipped (a fork) or failed; it just has no link to show
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    timeout-minutes: 30
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.number }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0 # See package.json for the stable node version that works with our testing.  Do not change this unless you know what you are doing as some node versions do not play nicely with our testing server.
      - name: Get the supportability metric registry from the base branch
        run: |
          git show "origin/${{ github.base_ref }}:tools/supportability-metrics/registry.js" > "$RUNNER_TEMP/base-registry.js" || rm -f "$RUNNER_TEMP/base-registry.js"
      - name: Install the source parser
        # Lets the comment list only the init settings and feature flags this PR adds. Without it the comment still works, but asks the author to check instead.
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund acorn@^8.17.0 acorn-walk@^8.3.5
      - name: Work out what Angler needs
        id: angler
        run: |
          node tools/supportability-metrics/angler-comment.js \
            --base-registry "$RUNNER_TEMP/base-registry.js" \
            --base-ref "origin/${{ github.base_ref }}" \
            --dashboard-url "${{ needs.sm-dashboard-preview.outputs.url }}" \
            --out "$RUNNER_TEMP/angler-comment.md"
      - name: Tell the author what to do in Angler
        # Regenerated on every push to the pull request: the comment is found by its tag and updated in place.
        if: steps.angler.outputs.relevant == 'true'
        uses: ./.github/actions/comment-pull-request
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.number }}
          comment_file: ${{ runner.temp }}/angler-comment.md
          comment_tag: <!-- supportability_metric_check -->
      - name: Update the comment if the pull request no longer changes supportability metrics
        if: steps.angler.outputs.relevant != 'true'
        run: |
          echo "## 🟢 Supportability metrics: nothing to do in Angler" > "$RUNNER_TEMP/angler-comment-cleared.md"
          echo "" >> "$RUNNER_TEMP/angler-comment-cleared.md"
          echo "This PR no longer changes the supportability metric registry, so no Angler PR is needed for it." >> "$RUNNER_TEMP/angler-comment-cleared.md"
      - name: Post the cleared comment, only if an earlier one exists
        if: steps.angler.outputs.relevant != 'true'
        uses: ./.github/actions/comment-pull-request
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.number }}
          comment_file: ${{ runner.temp }}/angler-comment-cleared.md
          comment_tag: <!-- supportability_metric_check -->
          only_update_existing: 'true'

  # EXPERIMENTAL. Tries to raise a pull request against Angler (agents/angler, on the internal GitHub) that rewrites the browser agent's block of
  # names in metric_names.txt to the set generated from this repository. The comment from sm-check is still how an author learns what to add.
  #
  # It only touches lines that start with `Browser/Supportability/`. Every other line of the file belongs to other teams and is kept exactly as it
  # is: tools/supportability-metrics/angler-sync.js checks that itself and refuses to write otherwise, and the job checks the diff a second time before
  # it pushes. It only opens a pull request and never merges one.
  #
  # The internal GitHub is reachable from inside the company network only, so the first step reports whether this runner can reach it. The runner can be
  # changed without a commit by setting the ANGLER_SYNC_RUNNER repository variable. It needs the ANGLER_GITHUB_TOKEN secret (a personal access token for
  # the internal GitHub that can push a branch to, and open pull requests on, the Angler repository).
  #
  # By default it is a dry run: it reports what would change and stops. To raise the real pull request, add the `angler-sync` label to this pull
  # request and re-run this job (the label is read when the job runs, not from when the workflow started). It never blocks the pull request.
  sm-angler-sync:
    name: Angler sync (experimental)
    needs: [sm-changes]
    runs-on: ${{ vars.ANGLER_SYNC_RUNNER || 'Browser-Agent-Assigned-IP-Linux' }}
    if: needs.sm-changes.outputs.changed == 'true' || needs.sm-changes.outputs.sync_changed == 'true'
    continue-on-error: true
    timeout-minutes: 15
    defaults:
      run:
        shell: bash
    env:
      ANGLER_HOST: source.datanerd.us
      ANGLER_REPO: agents/angler
      BASE_BRANCH: master
      ANGLER_FILE: src/main/resources/metric_names.txt
      ANGLER_GITHUB_TOKEN: ${{ secrets.ANGLER_GITHUB_TOKEN }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      PR_NUMBER: ${{ github.event.number }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0 # See package.json for the stable node version that works with our testing.  Do not change this unless you know what you are doing as some node versions do not play nicely with our testing server.
      # Only the parser is needed, not the whole dependency tree, to work out the `init` setting and feature flag names
      - name: Install the parser
        run: npm install --no-save --no-package-lock --ignore-scripts --no-audit --no-fund acorn@^8.17.0 acorn-walk@^8.3.5

      - name: Dry run, or raise the pull request?
        id: mode
        run: |
          # Read now, not from the event, so adding the label and re-running this job is enough
          labels=$(curl -sS --max-time 20 -H "Authorization: Bearer ${GITHUB_TOKEN}" "${GITHUB_API_URL}/repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/labels" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).map(l=>l.name).join("\n"))}catch(e){}})')
          if echo "$labels" | grep -qx 'angler-sync'; then dry_run=false; else dry_run=true; fi
          echo "dry_run=${dry_run}" >> "$GITHUB_OUTPUT"
          {
            echo "### Angler sync"
            echo "- Runner: \`${RUNNER_NAME}\` (${RUNNER_OS}, ${RUNNER_ARCH})"
            echo "- Target: \`${ANGLER_HOST}/${ANGLER_REPO}\` (\`${BASE_BRANCH}\`)"
            if [ "$dry_run" = "true" ]; then echo "- Mode: **dry run** (add the \`angler-sync\` label to this pull request and re-run this job to raise the pull request)"; else echo "- Mode: **raise the pull request** (the \`angler-sync\` label is on this pull request)"; fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Can this runner reach the internal GitHub?
        run: |
          if [ -z "$ANGLER_GITHUB_TOKEN" ]; then
            echo "::error::The ANGLER_GITHUB_TOKEN secret is not set, so there is no way to sign in to ${ANGLER_HOST}."
            echo "- Token: **not set**" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "- Token: set" >> "$GITHUB_STEP_SUMMARY"
          echo "Resolving ${ANGLER_HOST}:"
          (getent hosts "$ANGLER_HOST" || nslookup "$ANGLER_HOST" || true) 2>&1 | head -5
          status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -H "Authorization: token ${ANGLER_GITHUB_TOKEN}" "https://${ANGLER_HOST}/api/v3/repos/${ANGLER_REPO}" 2>/tmp/curl-error || true)
          echo "Status from https://${ANGLER_HOST}/api/v3/repos/${ANGLER_REPO}: ${status}"
          cat /tmp/curl-error 2>/dev/null || true
          case "$status" in
            200) echo "- Reach: **yes** (HTTP 200)" >> "$GITHUB_STEP_SUMMARY" ;;
            401|403|404) echo "- Reach: **yes, but the token was refused or cannot see the repository** (HTTP ${status})" >> "$GITHUB_STEP_SUMMARY"; echo "::error::${ANGLER_HOST} answered HTTP ${status}. Check the ANGLER_GITHUB_TOKEN secret and its access to ${ANGLER_REPO}."; exit 1 ;;
            *) echo "- Reach: **no** (no answer, or HTTP ${status}). The runner is probably not on the network that can reach ${ANGLER_HOST}, or needs the VPN." >> "$GITHUB_STEP_SUMMARY"; echo "::error::Could not reach ${ANGLER_HOST} from runner ${RUNNER_NAME}. It is probably not on the network that can reach it."; exit 1 ;;
          esac

      - name: Clone Angler
        run: git clone --depth 1 --branch "$BASE_BRANCH" "https://x-access-token:${ANGLER_GITHUB_TOKEN}@${ANGLER_HOST}/${ANGLER_REPO}.git" angler

      - name: Rewrite the browser agent's names
        id: sync
        env:
          DRY_RUN: ${{ steps.mode.outputs.dry_run }}
        run: |
          args=(--angler-file "angler/${ANGLER_FILE}" --summary-file angler-sync-summary.md)
          if [ "${DRY_RUN}" = "true" ]; then args+=(--dry-run); fi
          node tools/supportability-metrics/angler-sync.js "${args[@]}" | tee sync.log
          {
            echo
            echo '```text'
            cat sync.log
            echo '```'
            if [ -f angler-sync-summary.md ]; then
              echo '<details><summary>Pull request description</summary>'
              echo
              cat angler-sync-summary.md
              echo
              echo '</details>'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Check that only browser agent names changed
        if: steps.sync.outputs.changed == 'true' && steps.mode.outputs.dry_run != 'true'
        working-directory: angler
        run: |
          # The script checks this itself; this is a second, independent look at the result, so the pull request can never carry a change to another team's name
          changed_lines=$(git diff -U0 -- "${ANGLER_FILE}" | grep -E '^[+-][^+-]' | grep -vE '^[+-]\s*Browser/Supportability/' || true)
          if [ -n "$changed_lines" ]; then
            echo "::error::The change touches lines that are not browser agent names. Not raising a pull request."
            echo "$changed_lines" | head -20
            exit 1
          fi

      - name: Open the pull request
        if: steps.sync.outputs.changed == 'true' && steps.mode.outputs.dry_run != 'true'
        working-directory: angler
        run: |
          branch="browser-agent/supportability-names-${GITHUB_RUN_ID}"
          git config user.name "New Relic Browser Agent CI"
          git config user.email "browser-agent-ci@users.noreply.${ANGLER_HOST}"
          git checkout -b "$branch"
          git add "${ANGLER_FILE}"
          git commit -m "Update the browser agent's supportability metric names"
          git push origin "$branch"
          # printf, not an indented block, so the description does not pick up leading spaces (four of them would turn it into a code block)
          body="$(printf '%s\n\nRaised by %s/%s/actions/runs/%s from %s (%s/%s/pull/%s). Nothing merges this automatically.\n' "$(cat ../angler-sync-summary.md)" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" "$GITHUB_SHA" "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$PR_NUMBER")"
          payload=$(node -e 'console.log(JSON.stringify({ title: process.argv[1], head: process.argv[2], base: process.argv[3], body: process.argv[4] }))' "Update the browser agent's supportability metric names" "$branch" "$BASE_BRANCH" "$body")
          response=$(curl -sS --max-time 30 -X POST -H "Authorization: token ${ANGLER_GITHUB_TOKEN}" -H "Content-Type: application/json" -d "$payload" "https://${ANGLER_HOST}/api/v3/repos/${ANGLER_REPO}/pulls")
          url=$(echo "$response" | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).html_url||"")}catch(e){console.log("")}})')
          if [ -z "$url" ]; then
            echo "::error::The branch was pushed, but the pull request was not opened: $(echo "$response" | head -c 500)"
            exit 1
          fi
          echo "Opened ${url}"
          echo "- Pull request: ${url}" >> "$GITHUB_STEP_SUMMARY"

  resolve-latest-release:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 10
    defaults:
      run:
        shell: bash
    outputs:
      tag: ${{ steps.latest-tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Find latest release tag
        id: latest-tag
        run: |
          tag=$(git for-each-ref --sort=-creatordate --count=1 --format='%(refname:short)' 'refs/tags/v*')
          if [ -z "$tag" ]; then
            echo "No release tags found" >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

  size-capture:
    needs: resolve-latest-release
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    strategy:
      matrix:
        include:
          - label: current
            ref: ${{ github.ref }}
            display_label: 'This PR'
          - label: main
            ref: main
            display_label: 'Main Branch'
          - label: release
            ref: ${{ needs.resolve-latest-release.outputs.tag }}
            display_label: ${{ needs.resolve-latest-release.outputs.tag }}
    defaults:
      run:
        shell: bash
    steps:
      # Checks out the PR branch at the job's default working directory so
      # the size-diff action code used below is always the version being
      # introduced by this PR, regardless of which ref is actually built
      # (main/a release tag won't have this PR's action code yet).
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      # The ref actually being measured is checked out into ./target so it
      # never overwrites the action code above.
      - uses: actions/checkout@v4
        with:
          ref: ${{ matrix.ref }}
          path: target
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0 # See package.json for the stable node version that works with our testing.  Do not change this unless you know what you are doing as some node versions do not play nicely with our testing server.
      - name: Install dependencies
        working-directory: target
        run: npm ci
      - name: Running cdn build
        working-directory: target
        run: npm run cdn:build:prod
      - name: Running npm build
        working-directory: target
        run: |
          npm run npm:build:esm
          npm run npm:build:cjs
          npm run npm:build:types
      - name: Measuring npm pack size
        working-directory: target
        run: npm pack --json --dry-run --ignore-scripts > ./build/npm-pack.json
      - name: Capturing build size stats
        uses: ./.github/actions/size-diff
        with:
          mode: capture
          label: ${{ matrix.label }}
          display_label: ${{ matrix.display_label }}
          build_dir: ${{ github.workspace }}/target/build
          target_dir: ${{ github.workspace }}/target
          npm_pack_file: ${{ github.workspace }}/target/build/npm-pack.json
          output_file: ${{ github.workspace }}/build/size-stats-${{ matrix.label }}.json
      - name: Get local stats
        if: matrix.label == 'current'
        id: get-stats
        working-directory: target
        run: |
          rum=$(cat ./build/nr-rum-standard*.stats.json); echo "rum=$rum" >> $GITHUB_OUTPUT;
          full=$(cat ./build/nr-full-standard*.stats.json); echo "full=$full" >> $GITHUB_OUTPUT;
          spa=$(cat ./build/nr-spa-standard*.stats.json); echo "spa=$spa" >> $GITHUB_OUTPUT;
      - name: Report lite size to NR
        if: matrix.label == 'current'
        continue-on-error: true
        uses: newrelic-apps/capture-build-size@v1.0.1
        with:
          nr-api-key: ${{ secrets.INTERNAL_STAGING_INGEST_LICENSE_KEY }}
          nr-account-id: ${{ secrets.INTERNAL_STAGING_INGEST_ACCOUNT_ID }}
          nr-env: 'staging'
          analysis-file-contents: ${{ steps.get-stats.outputs.rum }}
          file-name-filter: '.min.js'
          trigger: 'pull-request-checks'
      - name: Report pro size to NR
        if: matrix.label == 'current'
        continue-on-error: true
        uses: newrelic-apps/capture-build-size@v1.0.1
        with:
          nr-api-key: ${{ secrets.INTERNAL_STAGING_INGEST_LICENSE_KEY }}
          nr-account-id: ${{ secrets.INTERNAL_STAGING_INGEST_ACCOUNT_ID }}
          nr-env: 'staging'
          analysis-file-contents: ${{ steps.get-stats.outputs.full }}
          file-name-filter: '.min.js'
          trigger: 'pull-request-checks'
      - name: Report spa size to NR
        if: matrix.label == 'current'
        continue-on-error: true
        uses: newrelic-apps/capture-build-size@v1.0.1
        with:
          nr-api-key: ${{ secrets.INTERNAL_STAGING_INGEST_LICENSE_KEY }}
          nr-account-id: ${{ secrets.INTERNAL_STAGING_INGEST_ACCOUNT_ID }}
          nr-env: 'staging'
          analysis-file-contents: ${{ steps.get-stats.outputs.spa }}
          file-name-filter: '.min.js'
          trigger: 'pull-request-checks'

  size-compare:
    needs: size-capture
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0 # See package.json for the stable node version that works with our testing.  Do not change this unless you know what you are doing as some node versions do not play nicely with our testing server.
      - name: Download build size stats
        uses: actions/download-artifact@v4
        with:
          pattern: size-stats-*
          path: ./build/stats
          merge-multiple: true
      - name: Generating asset size report
        uses: ./.github/actions/size-diff
        with:
          mode: compare
          stats_files: |
            current=./build/stats/size-stats-current.json
            main=./build/stats/size-stats-main.json
            release=./build/stats/size-stats-release.json
      - name: Reading asset size report
        id: asset-size-report
        run: |
          EOF=$(dd if=/dev/urandom bs=15 count=1 status=none | base64)
          echo "results<<$EOF" >> "$GITHUB_OUTPUT"
          echo "## Asset Size Report <br><br>" >> "$GITHUB_OUTPUT"
          echo "Comparing this branch build size against main and the latest release: <br><br>" >> "$GITHUB_OUTPUT"
          cat ./build/size_report.md >> "$GITHUB_OUTPUT"
          echo "$EOF" >> "$GITHUB_OUTPUT"
      - name: Comment pull request
        uses: ./.github/actions/comment-pull-request
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ github.event.number }}
          comment: ${{ steps.asset-size-report.outputs.results }}
          comment_tag: <!-- browser_agent asset size report -->

  size-check-dev-telemetry:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - name: Report dev lite size to NR
        continue-on-error: true
        uses: newrelic-apps/capture-build-size@v1.0.1
        with:
          nr-api-key: ${{ secrets.INTERNAL_STAGING_INGEST_LICENSE_KEY }}
          nr-account-id: ${{ secrets.INTERNAL_STAGING_INGEST_ACCOUNT_ID }}
          nr-env: 'staging'
          analysis-file-url: 'https://js-agent.newrelic.com/dev/nr-rum-standard.stats.json'
          file-name-filter: '.min.js'
          trigger: 'pull-request-checks'
          version: 'main'
      - name: Report dev pro size to NR
        continue-on-error: true
        uses: newrelic-apps/capture-build-size@v1.0.1
        with:
          nr-api-key: ${{ secrets.INTERNAL_STAGING_INGEST_LICENSE_KEY }}
          nr-account-id: ${{ secrets.INTERNAL_STAGING_INGEST_ACCOUNT_ID }}
          nr-env: 'staging'
          analysis-file-url: 'https://js-agent.newrelic.com/dev/nr-full-standard.stats.json'
          file-name-filter: '.min.js'
          trigger: 'pull-request-checks'
          version: 'main'
      - name: Report dev spa size to NR
        continue-on-error: true
        uses: newrelic-apps/capture-build-size@v1.0.1
        with:
          nr-api-key: ${{ secrets.INTERNAL_STAGING_INGEST_LICENSE_KEY }}
          nr-account-id: ${{ secrets.INTERNAL_STAGING_INGEST_ACCOUNT_ID }}
          nr-env: 'staging'
          analysis-file-url: 'https://js-agent.newrelic.com/dev/nr-spa-standard.stats.json'
          file-name-filter: '.min.js'
          trigger: 'pull-request-checks'
          version: 'main'

  # Jobs for workflow_dispatch events

  find-pull-request:
    name: Find pull request target
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    outputs:
      pull-request-target: ${{ steps.pull-request-target.outputs.results }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0 # See package.json for the stable node version that works with our testing.  Do not change this unless you know what you are doing as some node versions do not play nicely with our testing server.
      - name: Find pull request target
        id: pull-request-target
        uses: ./.github/actions/find-pull-request
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr_required: true

  pending-comment-pull-request:
    name: Pending comment pull request
    if: github.event_name == 'workflow_dispatch'
    needs: find-pull-request
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Setup runner
        run: sudo apt update && DEBIAN_FRONTEND=noninteractive sudo apt install -y git tzdata
      - uses: actions/checkout@v4
        with:
          ref: 'refs/pull/${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).pr_number }}/merge'
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0 # See package.json for the stable node version that works with our testing.  Do not change this unless you know what you are doing as some node versions do not play nicely with our testing server.
      - name: Get workflow time
        id: workflow-time
        run: echo "results=$(TZ=America/Chicago date +'%B %d, %Y %H:%M:%S %Z')" >> $GITHUB_OUTPUT
      - name: Comment pull request
        uses: ./.github/actions/comment-pull-request
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).pr_number }}
          comment: |
            [![Static Badge](https://img.shields.io/badge/Pull_Request_Checks-Pending-yellow)](https://github.com/newrelic/newrelic-browser-agent/actions/runs/${{ github.run_id }})

            Last ran on `${{ steps.workflow-time.outputs.results }}`
            Checking merge of (${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).head_sha }}) into [${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).base_ref }}](https://github.com/newrelic/newrelic-browser-agent/compare/${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).head_sha }}..${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).base_sha }}) (${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).base_sha }})
          comment_tag: <!-- browser_agent pull request checks -->

  wdio:
    name: WDIO
    if: github.event_name == 'workflow_dispatch'
    needs: find-pull-request
    uses: ./.github/workflows/wdio-all-browsers.yml
    with:
      ref: 'refs/pull/${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).pr_number }}/merge'
      latest-only: ${{ inputs.latest-only }}
      boosted: ${{ inputs.boosted }}
    secrets: inherit

  complete-status-comment-pull-request:
    name: Comment pull request
    if: always() && github.event_name == 'workflow_dispatch' && needs.find-pull-request.result == 'success'
    needs: [find-pull-request,wdio]
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    steps:
      - name: Setup container
        run: sudo apt update && DEBIAN_FRONTEND=noninteractive sudo apt install -y git tzdata
      - uses: actions/checkout@v4
        with:
          ref: 'refs/pull/${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).pr_number }}/merge'
      - uses: actions/setup-node@v4
        with:
          node-version: 22.11.0 # See package.json for the stable node version that works with our testing.  Do not change this unless you know what you are doing as some node versions do not play nicely with our testing server.
      - name: Get workflow time
        id: workflow-time
        run: echo "results=$(TZ=America/Chicago date +'%B %d, %Y %H:%M:%S %Z')" >> $GITHUB_OUTPUT
      - name: Comment pull request success
        if: ${{ !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') }}
        uses: ./.github/actions/comment-pull-request
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).pr_number }}
          comment: |
            [![Static Badge](https://img.shields.io/badge/Pull_Request_Checks-Success-green)](https://github.com/newrelic/newrelic-browser-agent/actions/runs/${{ github.run_id }})

            Last ran on `${{ steps.workflow-time.outputs.results }}`
            Checking merge of (${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).head_sha }}) into [${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).base_ref }}](https://github.com/newrelic/newrelic-browser-agent/compare/${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).head_sha }}..${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).base_sha }}) (${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).base_sha }})
          comment_tag: <!-- browser_agent pull request checks -->
      - name: Comment pull request failed
        if: ${{ contains(needs.*.result, 'failure') }}
        uses: ./.github/actions/comment-pull-request
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).pr_number }}
          comment: |
            [![Static Badge](https://img.shields.io/badge/Pull_Request_Checks-Failure-red)](https://github.com/newrelic/newrelic-browser-agent/actions/runs/${{ github.run_id }})

            Last ran on `${{ steps.workflow-time.outputs.results }}`
            Checking merge of (${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).head_sha }}) into [${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).base_ref }}](https://github.com/newrelic/newrelic-browser-agent/compare/${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).head_sha }}..${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).base_sha }}) (${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).base_sha }})
          comment_tag: <!-- browser_agent pull request checks -->
      - name: Comment pull request cancelled
        if: ${{ contains(needs.*.result, 'cancelled') }}
        uses: ./.github/actions/comment-pull-request
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          pr_number: ${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).pr_number }}
          comment: |
            [![Static Badge](https://img.shields.io/badge/Pull_Request_Checks-Cancelled-orange)](https://github.com/newrelic/newrelic-browser-agent/actions/runs/${{ github.run_id }})

            Last ran on `${{ steps.workflow-time.outputs.results }}`
            Checking merge of (${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).head_sha }}) into [${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).base_ref }}](https://github.com/newrelic/newrelic-browser-agent/compare/${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).head_sha }}..${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).base_sha }}) (${{ fromJSON(needs.find-pull-request.outputs.pull-request-target).base_sha }})
          comment_tag: <!-- browser_agent pull request checks -->
