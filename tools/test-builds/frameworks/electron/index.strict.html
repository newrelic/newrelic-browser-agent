<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!--
      A locked-down CSP of the kind a security-conscious Electron app ships: no inline script/style, no eval.
      Beyond 'self', the agent needs to reach its collector (connect-src; the test servers are *.nr-local.net)
      and to run its compression/replay workers from blobs (worker-src).
    -->
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src http://*.nr-local.net:*; worker-src blob:"
    />
    <title>Vite Electron (strict)</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="src/main.ts"></script>
  </body>
</html>
