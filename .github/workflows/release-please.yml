# Release Please automates releases using Conventional Commit messages. After each release it maintains an open PR
# called `chore(main): release <semver>`, which keeps the CHANGELOG.md up to date along with a changelog.json file.
# When the release PR is merged, this action will create a Github release. Our docs-site PR workflow will use the
# contents of the changelog.json file and PR headers to generate release notes for the public docs website.
# See https://github.com/google-github-actions/release-please-action
#
# Note: NPM publishing is handled by npm-operations.yml when the GitHub release is published. There is no
# automatic prerelease (RC) publishing from main.

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: write
  pull-requests: write

name: Release Please

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@db8f2c60ee802b3748b512940dde88eabd7b7e01 # v3
        with:
          release-type: node
          token: ${{ secrets.BROWSER_GITHUB_BOT_INTERNAL_PAT }}
          pull-request-header: "When this PR is merged, a new tagged release will be created with the notes below."
          changelog-types: |
            [
              {"type":"feat","section":"Features"},
              {"type":"enhancement","section":"Enhancements"},
              {"type":"fix","section":"Bug Fixes"},
              {"type":"security","section":"Security Fixes"}
            ]

  notify-failure:
    name: Notify Slack on failure
    needs: [release-please]
    if: ${{ failure() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1 # See package.json for the stable node version that works with our testing.  Do not change this unless you know what you are doing as some node versions do not play nicely with our testing server.
      - name: Notify Slack
        uses: ./.github/actions/notify-failure
        with:
          slack_webhook_url: ${{ secrets.SLACK_BROWSER_AGENT_DEV_WEBHOOK_URL }}
