# This composite action is used to upload files to an S3 bucket.

name: 'S3 File Upload'

inputs:
  aws_region:
    description: "AWS region where S3 bucket is located."
    required: false
    default: us-east-1
  aws_role:
    description: "AWS role ARN that needs to be used for authentication."
    required: true
  aws_bucket_name:
    description: "S3 bucket name where files need to be uploaded."
    required: true
  local_dir:
    description: "Local directory containing files to be uploaded."
    required: true
  dry_run:
    description: "Indicates if we should just list files to upload without uploading."
    required: false
  bucket_dir:
    description: 'A sub directory to put the files within the S3 bucket.'
    required: false

outputs:
  results:
    description: "Array of objects containing information about each file uploaded"
    value: ${{ steps.action-script.outputs.results }}

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials via GitHub OIDC
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.aws_role }}
        aws-region: ${{ inputs.aws_region }}
        role-session-name: browser-agent-s3-upload
    - name: Install dependencies
      run: npm ci --silent --no-progress --ignore-scripts --prefix $GITHUB_ACTION_PATH/..
      shell: bash
    - name: Run action script
      id: action-script
      env:
        INPUT_REGION: ${{ inputs.aws_region }}
        INPUT_BUCKET: ${{ inputs.aws_bucket_name }}
        INPUT_LOCAL_DIR: ${{ inputs.local_dir }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
        INPUT_BUCKET_DIR: ${{ inputs.bucket_dir }}
      run: |
        # Some callers pass a literal $GITHUB_WORKSPACE prefix, which the shell used to expand when the value was pasted into the script
        input_dir="${INPUT_LOCAL_DIR//\$GITHUB_WORKSPACE/$GITHUB_WORKSPACE}"
        args=(--region "$INPUT_REGION" --bucket "$INPUT_BUCKET" --input "$input_dir")
        if [[ -n "$INPUT_DRY_RUN" ]]; then args+=(--dry); fi
        if [[ -n "$INPUT_BUCKET_DIR" ]]; then args+=(--dir "$INPUT_BUCKET_DIR"); fi
        node "$GITHUB_ACTION_PATH/index.js" "${args[@]}"
      shell: bash
