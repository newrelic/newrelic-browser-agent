# This composite action is used to verify one or more files are available via fastly cache.

name: 'Fastly Verify'

inputs:
  fastly_key:
    description: 'Unused. Verification is an unauthenticated fetch.'
    required: false
  fastly_service:
    description: 'Fastly service to perform the purge on.'
    required: true
  asset_path:
    description: 'Path(s) to be verified. Separate multiple items by a space'
    required: true

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      run: npm install --silent --no-progress --prefix $GITHUB_ACTION_PATH/..
      shell: bash
    - name: Run action script
      id: action-script
      env:
        INPUT_SERVICE: ${{ inputs.fastly_service }}
        INPUT_ASSET_PATH: ${{ inputs.asset_path }}
      run: |
        set -f
        assets=()
        # The asset list is space separated and callers may format it with trailing line-continuation backslashes
        for asset in $INPUT_ASSET_PATH; do
          if [[ "$asset" != '\' ]]; then assets+=("$asset"); fi
        done
        args=(--service "$INPUT_SERVICE" --asset-path "${assets[@]}")
        node "$GITHUB_ACTION_PATH/index.js" "${args[@]}"
      shell: bash
