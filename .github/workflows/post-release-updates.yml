# This workflow is used to perform repository updates after a
# production release has been created.

name: Post Release Updates

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: write

jobs:
  post-release-updates:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LAMBDA_USERNAME: ${{ secrets.LAMBDA_USERNAME }}
      LAMBDA_ACCESS_KEY: ${{ secrets.LAMBDA_ACCESS_KEY }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ inputs.ref || github.ref || github.event.head_commit.ref }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1 # See package.json for the stable node version that works with our testing.  Do not change this unless you know what you are doing as some node versions do not play nicely with our testing server.
      - name: Perform updates
        uses: ./.github/actions/post-release-updates
        with:
          github_login: ${{ secrets.BROWSER_GITHUB_BOT_NAME }}
          github_token: ${{ secrets.BROWSER_GITHUB_BOT_INTERNAL_PAT }}
          github_email: ${{ secrets.BROWSER_GITHUB_BOT_EMAIL }}

  framework-specs:
    name: Framework informational specs
    needs: post-release-updates
    uses: ./.github/workflows/wdio-framework-specs.yml
    with:
      ref: ${{ github.ref }}
    secrets: inherit
