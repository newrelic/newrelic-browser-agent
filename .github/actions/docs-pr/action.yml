name: 'Docs PR'
description: >
  This composite action constructs and opens a pull request on the
  docs website repository.

inputs:
  tag:
    description: "Name of the tag to pull the release information for."
    required: true
  github_login:
    description: 'Github login associated with github authentication token.'
    required: true
  github_email:
    description: 'Email address associated with github login user.'
    required: true
  nr_docs_github_token:
    description: 'New Relic github org authentication token scoped to the docs repo'

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      run: npm ci --silent --no-progress --ignore-scripts --prefix $GITHUB_ACTION_PATH/..
      shell: bash
    - name: Run action script
      id: action-script
      env:
        INPUT_TAG: ${{ inputs.tag }}
        INPUT_GITHUB_LOGIN: ${{ inputs.github_login }}
        INPUT_GITHUB_EMAIL: ${{ inputs.github_email }}
        INPUT_DOCS_TOKEN: ${{ inputs.nr_docs_github_token }}
      run: |
        node "$GITHUB_ACTION_PATH/index.js" \
          --tag "$INPUT_TAG" \
          --github-login "$INPUT_GITHUB_LOGIN" \
          --github-email "$INPUT_GITHUB_EMAIL" \
          --nr-docs-github-token "$INPUT_DOCS_TOKEN"
      shell: bash
