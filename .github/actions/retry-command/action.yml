# This composite action runs a shell command, retrying it up to `max_attempts`
# times if it fails. Useful for wrapping steps that are known to be flaky
# (transient network calls, browser automation, etc.) without depending on a
# third-party marketplace action.

name: 'Retry Command'

inputs:
  command:
    description: 'The shell command to run and retry on failure.'
    required: true
  max_attempts:
    description: 'Maximum number of attempts before failing the step.'
    required: false
    default: '3'
  retry_wait_seconds:
    description: 'Seconds to wait between attempts.'
    required: false
    default: '10'
  timeout_minutes:
    description: 'Per-attempt timeout in minutes. Set to 0 (default) for no timeout.'
    required: false
    default: '0'

runs:
  using: "composite"
  steps:
    - name: Run command with retry
      shell: bash
      env:
        RETRY_COMMAND: ${{ inputs.command }}
        MAX_ATTEMPTS: ${{ inputs.max_attempts }}
        RETRY_WAIT_SECONDS: ${{ inputs.retry_wait_seconds }}
        TIMEOUT_MINUTES: ${{ inputs.timeout_minutes }}
      run: |
        attempt=1
        success=false
        timeout_seconds=$((TIMEOUT_MINUTES * 60))

        until [ "$attempt" -gt "$MAX_ATTEMPTS" ]; do
          echo "::group::Attempt $attempt of $MAX_ATTEMPTS"

          if [ "$timeout_seconds" -gt 0 ]; then
            timeout "${timeout_seconds}s" bash -c "$RETRY_COMMAND"
          else
            bash -c "$RETRY_COMMAND"
          fi
          exit_code=$?

          echo "::endgroup::"

          if [ "$exit_code" -eq 0 ]; then
            success=true
            break
          fi

          if [ "$attempt" -lt "$MAX_ATTEMPTS" ]; then
            echo "::warning::Attempt $attempt failed (exit code $exit_code). Retrying in ${RETRY_WAIT_SECONDS}s..."
            sleep "$RETRY_WAIT_SECONDS"
          fi

          attempt=$((attempt + 1))
        done

        if [ "$success" != "true" ]; then
          echo "::error::Command failed after $MAX_ATTEMPTS attempts"
          exit 1
        fi
