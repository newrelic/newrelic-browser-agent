# This composite action is used to verify all loaders of a specific
# version exist in NR environments.

name: 'NR Verify'

inputs:
  environment:
    description: 'Space delimited list of environments to verify.'
    required: false
  loader_version:
    description: "Browser Agent version number"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      run: npm install --silent --no-progress --prefix $GITHUB_ACTION_PATH/..
      shell: bash
    - name: Run action script
      id: action-script
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_LOADER_VERSION: ${{ inputs.loader_version }}
      run: |
        # Globbing is off and the environment list is deliberately unquoted so a space separated list splits into separate arguments
        set -f
        args=()
        if [[ -n "$INPUT_ENVIRONMENT" ]]; then args+=(--environment $INPUT_ENVIRONMENT); fi
        args+=(--loader-version "$INPUT_LOADER_VERSION")
        node "$GITHUB_ACTION_PATH/index.js" "${args[@]}"
      shell: bash
