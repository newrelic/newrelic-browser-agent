# This composite action is used to load test DEM Consumers and NR1 UIs

name: 'Consumer Load Test'

inputs:
  license-key:
    description: 'License key for the test'
    required: true
  app-id:
    description: 'App ID for the test'
    required: true
  entity-guid:
    description: 'Entity GUID for the test'
    required: true
  page-view:
    description: 'Capture PageView events'
    required: false
    type: boolean
  session-replay:
    description: 'Capture SessionReplay events'
    required: false
    type: boolean
  minutes:
    description: 'Minutes to Run'
    required: false

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      run: npm ci --silent --no-progress --ignore-scripts --prefix $GITHUB_ACTION_PATH/..
      shell: bash
    - name: Run action script
      id: action-script
      env:
        INPUT_LICENSE_KEY: ${{ inputs.license-key }}
        INPUT_APP_ID: ${{ inputs.app-id }}
        INPUT_ENTITY_GUID: ${{ inputs.entity-guid }}
        INPUT_PAGE_VIEW: ${{ inputs.page-view }}
        INPUT_SESSION_REPLAY: ${{ inputs.session-replay }}
        INPUT_MINUTES: ${{ inputs.minutes }}
      run: |
        node "$GITHUB_ACTION_PATH/index.cjs" \
          --license-key "$INPUT_LICENSE_KEY" \
          --app-id "$INPUT_APP_ID" \
          --entity-guid "$INPUT_ENTITY_GUID" \
          --page-view "$INPUT_PAGE_VIEW" \
          --session-replay "$INPUT_SESSION_REPLAY" \
          --minutes "$INPUT_MINUTES"
      shell: bash
