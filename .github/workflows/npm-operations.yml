name: NPM Operations

# Publishes the npm package for a GitHub release. Prerelease (rc) publishing from main has been removed, so this
# workflow only publishes released versions.

permissions:
  id-token: write
  attestations: write # required to sign the npm tarball provenance attestation
  contents: write

on:
  # Release - publishes the released version
  release:
    types: [published]

  # Manual re-publish of the version in package.json, for recovering a failed release-event run.
  # Limited to main or a release tag by the job condition below. Takes no inputs.
  workflow_dispatch:

jobs:
  npm-operations:
    # Manual dispatches are limited to main or a release tag
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    # Publishing requires approval through the npm-release environment
    environment: npm-release
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: bash

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          # Trusted Publishing requires `npm@11.5.1` or later. Compatible
          # versions of `npm` started shipping with Node.js v24.5.0.
          # If, for some odd reason, you need to use an earlier Node.js release,
          # you _must_ add another step subsequent to this one that performs:
          # `npm install -g npm@latest`.
          node-version: 24.22.1
          # This is important. The OIDC exchange requires that the registry
          # URL matches on both ends.
          registry-url: https://registry.npmjs.org

      - name: Install project dependencies
        run: npm ci

      # Build NPM package for release
      - name: Build npm package
        run: npm run build:npm

      # Hash the exact tarball that will be published, so the attestation and the published manifest describe
      # the same bytes the registry receives.
      - name: Generate npm integrity record
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          shopt -s nullglob
          tarballs=(temp/*.tgz)
          if [[ ${#tarballs[@]} -ne 1 ]]; then
            echo "Expected exactly one tarball in temp/, found ${#tarballs[@]}"
            exit 1
          fi
          echo "NPM_TARBALL=${tarballs[0]}" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/npm-integrity"
          node .github/scripts/generate-npm-integrity.mjs "${tarballs[0]}" \
            "$RUNNER_TEMP/npm-integrity/npm-integrity-manifest.json" \
            "$RUNNER_TEMP/npm-integrity/checksums.txt" \
            "$RELEASE_TAG" "$GITHUB_SHA"

      - name: Attest npm tarball provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4
        with:
          subject-checksums: ${{ runner.temp }}/npm-integrity/checksums.txt

      # Publish release version. Publishes the tarball that was hashed and attested above, not a fresh pack.
      - name: Publish npm package (release)
        run: npm publish "$NPM_TARBALL"

      # Separate asset from publish-release.yml's integrity-manifest.json, since both workflows run on the
      # same release event and would otherwise race to upload the same file name.
      - name: Attach npm integrity record to release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" "$RUNNER_TEMP/npm-integrity/npm-integrity-manifest.json" --repo "$GITHUB_REPOSITORY"

