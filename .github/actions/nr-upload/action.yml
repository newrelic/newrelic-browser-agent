# This composite action is used to upload all loaders of a specific
# version to the internal NR.

name: 'NR Upload'

inputs:
  environment:
    description: 'Space delimited list of environments to upload to.'
    required: false
  nr_prod_api_key:
    description: 'API key to use for talking to production RPM site to upload loaders'
    required: false
  nr_stage_api_key:
    description: 'API key to use for talking to staging RPM site to upload loaders'
    required: false
  loader_version:
    description: "Browser Agent version number"
    required: true

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      run: npm ci --silent --no-progress --ignore-scripts --prefix $GITHUB_ACTION_PATH/..
      shell: bash
    - name: Run action script
      id: action-script
      env:
        INPUT_ENVIRONMENT: ${{ inputs.environment }}
        INPUT_PROD_API_KEY: ${{ inputs.nr_prod_api_key }}
        INPUT_STAGE_API_KEY: ${{ inputs.nr_stage_api_key }}
        INPUT_LOADER_VERSION: ${{ inputs.loader_version }}
      run: |
        # Globbing is off and the environment list is deliberately unquoted so a space separated list splits into separate arguments
        set -f
        args=()
        if [[ -n "$INPUT_ENVIRONMENT" ]]; then args+=(--environment $INPUT_ENVIRONMENT); fi
        if [[ -n "$INPUT_PROD_API_KEY" ]]; then args+=(--prod-api-key "$INPUT_PROD_API_KEY"); fi
        if [[ -n "$INPUT_STAGE_API_KEY" ]]; then args+=(--stage-api-key "$INPUT_STAGE_API_KEY"); fi
        args+=(--loader-version "$INPUT_LOADER_VERSION")
        node "$GITHUB_ACTION_PATH/index.js" "${args[@]}"
      shell: bash
