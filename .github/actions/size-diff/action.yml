# This composite action captures and compares build size stats for the browser agent.

name: 'Build Size Stats'

inputs:
  mode:
    description: 'Either `capture` (normalize the current local build into a single stats file) or `compare` (diff previously captured stats files).'
    required: true
  label:
    description: '(capture mode) Label identifying the ref being captured, e.g. `current`, `main`, `release`.'
    required: false
  build_dir:
    description: '(capture mode) Path to the build directory containing the webpack *.stats.json files to capture.'
    required: false
  target_dir:
    description: '(capture mode) Path to the checked-out source tree (containing package.json and src/) being measured.'
    required: false
  display_label:
    description: '(capture mode) Optional human-readable label to display in reports instead of `label`, e.g. a resolved release tag.'
    required: false
  npm_pack_file:
    description: '(capture mode) Path to the JSON output of `npm pack --json --dry-run`.'
    required: false
  output_file:
    description: '(capture mode) Path to write the normalized capture stats file to.'
    required: false
  stats_files:
    description: '(compare mode) Newline-separated list of `label=path` pairs. The first entry is treated as the base column that others are diffed against.'
    required: false

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      run: npm install --silent --no-progress --prefix $GITHUB_ACTION_PATH/..
      shell: bash
    - name: Run capture
      if: inputs.mode == 'capture'
      env:
        INPUT_LABEL: ${{ inputs.label }}
        INPUT_BUILD_DIR: ${{ inputs.build_dir }}
        INPUT_TARGET_DIR: ${{ inputs.target_dir }}
        INPUT_DISPLAY_LABEL: ${{ inputs.display_label }}
        INPUT_NPM_PACK_FILE: ${{ inputs.npm_pack_file }}
        INPUT_OUTPUT_FILE: ${{ inputs.output_file }}
      run: |
        node "$GITHUB_ACTION_PATH/index.js" \
          --mode capture \
          --label "$INPUT_LABEL" \
          --build-dir "$INPUT_BUILD_DIR" \
          --target-dir "$INPUT_TARGET_DIR" \
          --display-label "$INPUT_DISPLAY_LABEL" \
          --npm-pack-file "$INPUT_NPM_PACK_FILE" \
          --output-file "$INPUT_OUTPUT_FILE"
      shell: bash
    - name: Run compare
      if: inputs.mode == 'compare'
      env:
        INPUT_STATS_FILES: ${{ inputs.stats_files }}
      run: |
        STATS_FILE_ARGS=()
        while IFS= read -r line; do
          [ -z "$line" ] && continue
          STATS_FILE_ARGS+=(--stats-file "$line")
        done <<< "$INPUT_STATS_FILES"

        node "$GITHUB_ACTION_PATH/index.js" \
          --mode compare \
          "${STATS_FILE_ARGS[@]}" \
          --format terminal json markdown
      shell: bash
    - name: Archive capture stats
      if: inputs.mode == 'capture'
      uses: actions/upload-artifact@v7
      with:
        name: size-stats-${{ inputs.label }}
        path: ${{ inputs.output_file }}
    - name: Archive asset size report results
      if: inputs.mode == 'compare'
      uses: actions/upload-artifact@v7
      with:
        name: asset-size-report
        path: |
          build/size_report.*
