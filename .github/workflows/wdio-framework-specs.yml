name: 'WDIO: Framework informational specs'

# Informational-only framework compatibility checks (tests/framework-specs/**). Deliberately not
# referenced by pull-request-checks.yml - only runs via manual dispatch or when chained from
# another workflow (e.g. post-release-updates.yml).
on:
  workflow_dispatch:
    inputs:
      browser-target:
        description: 'Which browser(s) and version(s) to target with the wdio test: chrome@latest OR chrome@* are examples'
        required: false
        type: string
        default: 'chrome@latest,edge@latest,firefox@latest,safari@latest'
  workflow_call:
    inputs:
      ref:
        description: 'Github branch ref to checkout and run tests on'
        required: false
        type: string
      browser-target:
        description: 'Which browser(s) and version(s) to target with the wdio test: chrome@latest OR chrome@* are examples'
        required: false
        type: string
        default: 'chrome@latest,edge@latest,firefox@latest,safari@latest'
    secrets:
      LAMBDA_USERNAME:
        required: true
      LAMBDA_ACCESS_KEY:
        required: true
      AWS_ACCESS_KEY_ID:
        required: true
      AWS_SECRET_ACCESS_KEY:
        required: true
      AWS_ROLE_ARN:
        required: true
      AWS_BUCKET:
        required: true

permissions:
  contents: read

jobs:
  framework-specs:
    name: WDIO Framework Informational Specs
    timeout-minutes: 60
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
    env:
      LAMBDA_USERNAME: ${{ secrets.LAMBDA_USERNAME }}
      LAMBDA_ACCESS_KEY: ${{ secrets.LAMBDA_ACCESS_KEY }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || github.ref }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24.14.0 # See package.json for the stable node version that works with our testing. Do not change this unless you know what you are doing as some node versions do not play nicely with our testing server.
      - name: Install dependencies
        run: npm ci
      - name: Bump framework test-build apps to latest stable versions
        run: npm run test-builds:bump-latest
      - name: Build npm package and framework test-build apps
        run: npm run build:frameworks
      - name: Run WDIO framework informational tests
        run: |
          node --max-old-space-size=8192 ./tools/wdio/bin/cli.js \
            -T \
            --concurrent=4 \
            -b '${{ inputs.browser-target || 'chrome@latest,edge@latest,firefox@latest,safari@latest' }}' \
            --framework \
            ${{ runner.debug && '-v -L -D -d' || '' }}
        continue-on-error: true
      - name: Run WDIO framework informational tests against Electron
        # Runs locally (not on LambdaTest) in the packaged Electron browser at tools/local-browsers/electron,
        # which the runner installs and packages on demand. Both security modes run concurrently, each in its
        # own Electron instance, and write their rows to the same .framework-results folder as the step above.
        run: |
          xvfb-run -a node --max-old-space-size=8192 ./tools/wdio/bin/cli.js \
            --framework -b electron --concurrent=2 \
            ${{ runner.debug && '-v -L -d' || '' }}
        continue-on-error: true
      - name: Generate framework informational report
        run: npm run test-builds:framework-report
      - name: Upload report to S3
        id: s3-upload-report
        uses: ./.github/actions/s3-upload
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_role: ${{ secrets.AWS_ROLE_ARN }}
          aws_bucket_name: ${{ secrets.AWS_BUCKET }}
          local_dir: .framework-results
          bucket_dir: reports/framework-informational
      - name: Summarize report URL
        run: |
          AGENT_VERSION=$(node -p "require('./package.json').version")
          echo "### Framework informational report" >> "$GITHUB_STEP_SUMMARY"
          echo "https://js-agent.newrelic.com/reports/framework-informational/report-${AGENT_VERSION}.html" >> "$GITHUB_STEP_SUMMARY"
