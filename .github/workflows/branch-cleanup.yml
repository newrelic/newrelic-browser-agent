# This workflow will run automatically when a branch is deleted.

name: Branch Cleanup

on: delete

permissions:
  contents: read
  id-token: write

jobs:
  branch-delete:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 24.22.1 # See package.json for the stable node version that works with our testing.  Do not change this unless you know what you are doing as some node versions do not play nicely with our testing server.
      # Same sanitizing as publish-experiment.yml so the S3 prefix matches what was published
      - name: Clean up for deleted branch
        id: cleanup-start
        env:
          DELETED_REF: ${{ github.event.ref }}
        run: |
          echo "Clean up for branch ${DELETED_REF}"
          echo "results=$(printf '%s' "${DELETED_REF}" | sed 's/[^[:alnum:].-]/-/g')" >> $GITHUB_OUTPUT
      - name: Delete dev experiment
        id: s3-delete-dev
        uses: ./.github/actions/s3-delete
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_role: ${{ secrets.AWS_ROLE_ARN }}
          aws_bucket_name: ${{ secrets.AWS_BUCKET }}
          bucket_dir: experiments/dev/${{ steps.cleanup-start.outputs.results }}
      - name: Delete staging experiment
        id: s3-delete-staging
        uses: ./.github/actions/s3-delete
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_role: ${{ secrets.AWS_ROLE_ARN }}
          aws_bucket_name: ${{ secrets.AWS_BUCKET }}
          bucket_dir: experiments/staging/${{ steps.cleanup-start.outputs.results }}
      - name: Delete standalone experiment
        id: s3-delete-standalone
        uses: ./.github/actions/s3-delete
        with:
          aws_access_key_id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws_secret_access_key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws_role: ${{ secrets.AWS_ROLE_ARN }}
          aws_bucket_name: ${{ secrets.AWS_BUCKET }}
          bucket_dir: experiments/standalone/${{ steps.cleanup-start.outputs.results }}
