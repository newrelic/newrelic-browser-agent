name: 'Build Agent2Query Assets'
description: 'Builds Agent2Query test assets with templated license keys'

inputs:
  latest_staging_license_key:
    description: 'License key for the latest staging version'
    required: true
  latest_us_prod_license_key:
    description: 'License key for the latest US production version'
    required: true
  released_staging_license_key:
    description: 'License key for the released staging version'
    required: true
  released_us_prod_license_key:
    description: 'License key for the released US production version'
    required: true

runs:
  using: "composite"
  steps:
    - name: Install dependencies
      run: npm install --silent --no-progress --prefix $GITHUB_ACTION_PATH/..
      shell: bash
    - name: Build Agent2Query assets
      env:
        INPUT_LATEST_STAGING_KEY: ${{ inputs.latest_staging_license_key }}
        INPUT_LATEST_US_PROD_KEY: ${{ inputs.latest_us_prod_license_key }}
        INPUT_RELEASED_STAGING_KEY: ${{ inputs.released_staging_license_key }}
        INPUT_RELEASED_US_PROD_KEY: ${{ inputs.released_us_prod_license_key }}
      run: |
        node "$GITHUB_ACTION_PATH/index.js" \
          --latest-staging-license-key "$INPUT_LATEST_STAGING_KEY" \
          --latest-us-prod-license-key "$INPUT_LATEST_US_PROD_KEY" \
          --released-staging-license-key "$INPUT_RELEASED_STAGING_KEY" \
          --released-us-prod-license-key "$INPUT_RELEASED_US_PROD_KEY"
      shell: bash
