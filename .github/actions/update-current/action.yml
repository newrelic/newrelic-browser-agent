# This composite action is used to copy the loaders of an agent version to the current version

name: 'Update Current'

inputs:
  aws_region:
    description: "AWS region where S3 bucket is located."
    required: false
    default: us-east-1
  aws_role:
    description: "AWS role ARN that needs to be used for authentication."
    required: true
  aws_bucket_name:
    description: "S3 bucket name where files need to be uploaded."
    required: true
  loader_version:
    description: "Browser Agent version number"
    required: true
  dry_run:
    description: "Indicates if we should just list files to upload without uploading."
    required: false

outputs:
  results:
    description: "Array of objects containing information about each file copied"
    value: ${{ steps.action-script.outputs.results }}

runs:
  using: "composite"
  steps:
    - name: Configure AWS credentials via GitHub OIDC
      uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
      with:
        role-to-assume: ${{ inputs.aws_role }}
        aws-region: ${{ inputs.aws_region }}
        role-session-name: browser-agent-update-current
    - name: Install dependencies
      run: npm ci --silent --no-progress --ignore-scripts --prefix $GITHUB_ACTION_PATH/..
      shell: bash
    - name: Run action script
      id: action-script
      env:
        INPUT_REGION: ${{ inputs.aws_region }}
        INPUT_BUCKET: ${{ inputs.aws_bucket_name }}
        INPUT_LOADER_VERSION: ${{ inputs.loader_version }}
        INPUT_DRY_RUN: ${{ inputs.dry_run }}
      run: |
        args=(--region "$INPUT_REGION" --bucket "$INPUT_BUCKET" --loader-version "$INPUT_LOADER_VERSION")
        if [[ -n "$INPUT_DRY_RUN" ]]; then args+=(--dry); fi
        node "$GITHUB_ACTION_PATH/index.js" "${args[@]}"
      shell: bash
